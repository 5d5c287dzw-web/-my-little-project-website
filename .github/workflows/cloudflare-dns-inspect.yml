name: Inspect My Little Project DNS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-dns-inspect.yml
      - scripts/cloudflare_dns_inspect.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shop DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare_dns_inspect.py
