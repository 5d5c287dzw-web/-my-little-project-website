name: Verify Actions runner
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions-runner-healthcheck.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret injection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Token present"
          else
            echo "Token absent"
          fi
