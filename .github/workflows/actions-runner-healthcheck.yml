name: Verify Actions runner
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions-runner-healthcheck.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check built-in secret injection
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test -n "$TOKEN" && echo "Built-in token present"
